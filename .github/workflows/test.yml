steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - run: npm install

  - run: npm test

  - run: npm install -g vercel

  - run: vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
    env:
      VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}